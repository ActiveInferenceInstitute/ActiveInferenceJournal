# AII sidecar — InstituteOS metadata. Schema: aii_platform.aii_sidecar
meta:
  sidecar_version: 1.2.1
  updated: '2026-11-11'
repo:
  name: ActiveInferenceJournal
  slug: activeinferencejournal
  full_name: ActiveInferenceInstitute/ActiveInferenceJournal
  description: Content of the Active Inference Journal — transcripts, metadata, captions,
    translations, and curated materials from the Active Inference Institute video
    library.
institute:
  category: publication
  maturity: released
  steward: Active Inference Institute
ecosystem:
  relations:
  - repo: ActiveInferenceInstitute/InstituteOS
    relation: referenced-by
    note: Federated via the InstituteOS .aii manifest.
  - repo: ActiveInferenceInstitute/Active_Inference_Ontology
    relation: references
    note: Uses Active Inference Ontology terms.
  links:
    github: https://github.com/ActiveInferenceInstitute/ActiveInferenceJournal
    website: https://www.activeinference.org
artifacts:
- path: README.md
  kind: doc
  description: Repository overview.
- path: AGENTS.md
  kind: doc
  description: Agent guidance.
- path: INDEX.json
  kind: data
  description: Machine entry point — every item, its videos, and paths.
- path: INDEX.md
  kind: doc
  description: Human index, grouped by series.
- path: LICENSE
  kind: doc
  description: License.
- path: CITATION.cff
  kind: citation
  description: Machine-readable citation metadata.
- path: docs
  kind: doc
  description: Documentation tree.
provenance:
  license: CC-BY-4.0
  citation:
    zenodo: https://zenodo.org/badge/latestdoi/562916661
    text: Active Inference Institute — ActiveInferenceJournal.
instituteos:
  tags:
  - journal
  - publication
  - transcripts
  - active-inference
  - html
capabilities:
- documentation
- dataset
- ci
- citation
tasks:
  docs:
    cmd: ls docs
    description: List documentation.
  inventory:
    cmd: git ls-files
    description: List tracked files.
  identity:
    cmd: ./run.sh identity
    description: Check the publishing contract record ids and the schema digest.
docs:
- README.md
- AGENTS.md
- docs/README.md
- docs/AGENTS.md
- docs/workflows/publishing.md
schema: aii-sidecar/v1
