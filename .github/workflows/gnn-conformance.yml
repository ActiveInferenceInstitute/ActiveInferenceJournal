name: GNN conformance

# The pinned GNN parser check, kept out of the deploy path: it installs a
# package from git, which the Pages deploy has no reason to wait for.
# Job key and display name are the ones the repository documents.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gnn-conformance:
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out journal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Pinned GNN conformance
        run: ./run.sh gnn
