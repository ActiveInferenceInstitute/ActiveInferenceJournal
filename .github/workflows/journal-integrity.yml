name: Validate journal integrity

# The release gate. Every step runs the same command a developer runs locally:
#   ./run.sh <arm>
# See docs/OPERATIONS.md ("Gate arms"). GNN conformance is its own workflow
# (gnn-conformance.yml) so the Pages deploy never waits on a pip install.

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out journal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # One pin, one file. The ref below is read from .github/journal-utilities-pin.json
      # so the gate, this workflow and the deploy workflow cannot drift apart.
      - name: Read the Journal-Utilities pin
        id: pin
        run: echo "revision=$(python3 scripts/gate/pin.py --revision)" >> "$GITHUB_OUTPUT"

      - name: Check out Journal-Utilities (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ActiveInferenceInstitute/Journal_Utilities
          ref: ${{ steps.pin.outputs.revision }}
          path: .journal-utilities
          fetch-depth: 1

      - name: Gate lint
        run: ./run.sh lint

      - name: Gate docs
        run: ./run.sh docs

      - name: Gate fast (derived indexes)
        run: ./run.sh fast --utilities .journal-utilities

      - name: Gate full (transcripts, integrity, reconciliation)
        run: ./run.sh full --utilities .journal-utilities
