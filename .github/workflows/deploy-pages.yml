name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'INDEX.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  integrity:
    uses: ./.github/workflows/journal-integrity.yml
    permissions:
      contents: read

  build-and-deploy:
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out ActiveInferenceJournal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: journal
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # One pin, one file: this ref comes from .github/journal-utilities-pin.json,
      # the same revision the integrity gate and local `./run.sh` use. The M4
      # path-keyed builder lives in that revision (the v0.1.0 tag peels to an
      # older commit without it, and branch refs drift silently); the sparse
      # checkout keeps the deploy down to the builder and its package.
      - name: Read the Journal-Utilities pin
        id: pin
        run: echo "revision=$(python3 journal/scripts/gate/pin.py --revision)" >> "$GITHUB_OUTPUT"

      - name: Check out Journal-Utilities (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ActiveInferenceInstitute/Journal_Utilities
          ref: ${{ steps.pin.outputs.revision }}
          path: utilities
          fetch-depth: 1
          sparse-checkout: |
            scripts/build_pages_site.py
            src/journal_utilities

      # Plain stdlib python: build_pages_site.py imports only
      # journal_utilities.site.builder (json/logging/re/shutil/pathlib).
      # No uv sync, no torch/CUDA (handoff E5/J7).
      #
      # --apply is REQUIRED: the builder is dry-run by default and writes
      # nothing without it, which would publish an empty site (the smoke test
      # below would catch it, but only after the empty Pages artifact is
      # already live).
      - name: Build static site bundle
        run: |
          python3 utilities/scripts/build_pages_site.py --journal journal --output _site --apply
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          # v5 excludes hidden files by default; .nojekyll must reach Pages.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Post-deploy smoke test
        run: |
          BASE="${{ steps.deployment.outputs.page_url }}"
          status=0
          for f in index.html manifest.json .nojekyll sitemap.xml robots.txt \
                   "item/TextbookGroup/ParrPezzuloFriston2022/Cohort_1/Meeting_007/" \
                   "data/TextbookGroup/ParrPezzuloFriston2022/Cohort_1/Meeting_007.json"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${BASE}${f}")
            echo "$f -> HTTP $code"
            [ "$code" = "200" ] || status=1
          done

          # The M4 item page must be server-rendered: the canonical link is in
          # the HTML without running JS. The URL above is a TextbookGroup
          # cohort item — one level below its series directory — so it only
          # resolves once the path-keyed builder is deployed.
          item_page="${BASE}item/TextbookGroup/ParrPezzuloFriston2022/Cohort_1/Meeting_007/"
          if curl -sf "${item_page}" | grep -q 'rel="canonical"'; then
            echo "canonical link on item page -> present"
          else
            echo "canonical link on item page -> MISSING"
            status=1
          fi
          exit "$status"
