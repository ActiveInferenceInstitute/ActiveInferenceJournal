name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ActiveInferenceJournal
        uses: actions/checkout@v4
        with:
          path: journal
          fetch-depth: 0

      - name: Check out Journal-Utilities
        uses: actions/checkout@v4
        with:
          repository: ActiveInferenceInstitute/Journal-Utilities
          path: utilities

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build Static Site Bundle
        run: |
          cd utilities
          uv run python scripts/build_pages_site.py --journal ../journal --output ../_site
          # Add .nojekyll to prevent Jekyll processing on GitHub Pages
          touch ../_site/.nojekyll

      # 1. Deploy via GitHub Actions Pages artifact (when Pages source is GitHub Actions)
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages (Actions mode)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # 2. Deploy to gh-pages branch (when Pages source is "Deploy from a branch")
      - name: Deploy to gh-pages branch (Branch mode)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
