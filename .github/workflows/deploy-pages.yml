name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ActiveInferenceJournal
        uses: actions/checkout@v4
        with:
          path: journal

      - name: Check out Journal-Utilities
        uses: actions/checkout@v4
        with:
          repository: ActiveInferenceInstitute/Journal-Utilities
          path: utilities

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build Static Site Bundle
        run: |
          cd utilities
          uv run python scripts/build_pages_site.py --journal ../journal --output ../_site

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
