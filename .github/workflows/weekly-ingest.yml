name: Weekly ingest

# M3: channel enumeration + new-video delta + scaffold preview + reconciliation report
# (read-only to YouTube; nothing is written to the channel).
#
# Status: DISPATCH-ONLY. Secret-free by design: enumeration and status resolution
# run on yt-dlp, so no YOUTUBE_API_KEY exists to configure and a future scheduled
# run needs no owner secret. `schedule:` stays absent until the owner promotes
# this draft to a scheduled job; the guard step below fails loudly if the
# workflow is ever triggered by anything but a manual dispatch.
#
# How it works (Journal_Utilities docs/m3-ingest.md is the contract):
#   1. `ingest.ytdlp` makes one flat yt-dlp pass over /videos + /streams +
#      /shorts, diffs it against INDEX.json, and resolves only the new videos
#      with one full per-video extraction each (--max-new caps the delta, newest
#      first). Fields the extractor cannot determine are recorded as "unknown";
#      no status is upgraded without evidence, so a flat entry alone can never
#      come out "published" and an unresolved video stays "unknown".
#   2. `ingest.scaffold` prints the metadata.json previews (dry-run only).
#   3. `ingest.diff` reports channel vs INDEX vs per-video manifests. The
#      per-video download manifests live in the Journal_Utilities download store
#      (tracked, ~1.5 GB) and are not checked out here, so this report covers the
#      channel and INDEX dimensions — the ones that matter for coverage. It exits
#      nonzero unless all three sets agree, which a fresh delta cannot satisfy
#      before it is ingested, so the step is diagnostic (continue-on-error) and
#      the report is uploaded as an artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout journal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Ingest is a separate role in the same lock file: this workflow needs
      # journal_utilities.ingest.ytdlp, which does not exist at the gate
      # revision. See .github/journal-utilities-pin.json.
      - name: Read the Journal-Utilities pin
        id: pin
        run: echo "revision=$(python3 scripts/gate/pin.py --revision --role ingest)" >> "$GITHUB_OUTPUT"

      - name: Checkout Journal_Utilities (pinned, secret-free ingest)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ActiveInferenceInstitute/Journal_Utilities
          ref: ${{ steps.pin.outputs.revision }}
          path: .journal-utilities
          fetch-depth: 1
          sparse-checkout: |
            src
            pyproject.toml
            uv.lock

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Python
        run: uv python install 3.12

      - name: Dispatch-only guard (draft)
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "::error::This workflow is dispatch-only while it is a draft."
          echo "It must not run from a schedule or another event yet: review"
          echo "Journal_Utilities docs/m3-ingest.md and remove this guard before"
          echo "adding a schedule."
          exit 1

      - name: Enumerate channel and resolve the new-video delta (yt-dlp, no key)
        run: |
          uv run --frozen --project .journal-utilities python -m journal_utilities.ingest.ytdlp \
            --journal . \
            --output data/output/ingest-worklist.json \
            --channel-output data/output/channel_videos.json \
            --max-new 50 --no-dry-run

      - name: Scaffold preview (dry-run)
        run: |
          uv run --frozen --project .journal-utilities python -m journal_utilities.ingest.scaffold \
            --journal . --worklist data/output/ingest-worklist.json

      - name: Reconciliation report (channel vs INDEX; diagnostic)
        continue-on-error: true
        run: |
          echo "::notice::ingest.diff exits nonzero unless channel, per-video"
          echo "manifests and INDEX fully agree; a fresh delta cannot agree until it"
          echo "is ingested, so this report is diagnostic and is uploaded below."
          uv run --frozen --project .journal-utilities python -m journal_utilities.ingest.diff \
            --journal . --channel-manifest data/output/channel_videos.json \
            --output data/output/reconciliation-report.json

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ingest-reports
          path: |
            data/output/ingest-worklist.json
            data/output/channel_videos.json
            data/output/reconciliation-report.json
